<!DOCTYPE html>
<html lang="es">
    <head>
        <link rel=icon href="{{ url_for('static', filename='static/img/principal.jpg') }}" type="image/x-icon">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style2.css') }}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ title }}</title>
    </head>
    <body>
        <div class="container-fluid">

            <nav aria-label="Navegación principal">
                <div class="nav nav-tabs">
                    <a class="nav-link{% if request.endpoint == 'home' %} active{% endif %}" href="{{ url_for('home') }}"{% if request.endpoint == 'home' %} aria-current="page"{% endif %}>Inicio</a>
                    <a class="nav-link{% if request.endpoint == 'catalogo' %} active{% endif %}" href="{{ url_for('catalogo') }}"{% if request.endpoint == 'catalogo' %} aria-current="page"{% endif %}>Catálogo</a>
                    <a class="nav-link{% if request.endpoint == 'servicios' %} active{% endif %}" href="{{ url_for('servicios') }}"{% if request.endpoint == 'servicios' %} aria-current="page"{% endif %}>Servicios</a>
                    <a class="nav-link{% if request.endpoint == 'contacto' %} active{% endif %}" href="{{ url_for('contacto') }}"{% if request.endpoint == 'contacto' %} aria-current="page"{% endif %}>Contacto</a>
                </div>
            </nav>

            {% block content %}

            {% endblock %}
        </div>

        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
                <!-- Popper.js -->
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
                    <!-- Bootstrap 4.6 JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    </body>
</html>
